# Publishes nuscope to PyPI when a version tag (v0.4.0, ...) is pushed.
# Uses PyPI trusted publishing (OpenID Connect): no API token is stored anywhere.
# One-time setup on pypi.org -> Your account -> Publishing -> "Add a new pending publisher":
#   PyPI project name: nuscope, owner: NUANCE-IT, repository: NUScope,
#   workflow: release.yml, environment: pypi
name: release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test
        run: |
          pip install -e ".[dev]"
          pytest -q
      - name: Tag matches package version
        run: |
          v=$(python -c "import nuscope; print(nuscope.__version__)")
          test "v$v" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != version $v"; exit 1; }
      - name: Build and check
        run: |
          python -m build
          twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
