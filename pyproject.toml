[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nuscope"
version = "0.4.1"
description = "Read, analyze, save and trace electron-microscopy data at the NUANCE Center, Northwestern University"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"   # zarr 3 needs 3.11
authors = [{ name = "Roberto dos Reis", email = "robertomsreis@gmail.com" }]
maintainers = [{ name = "Roberto dos Reis (@rmsreis)" }]
keywords = ["electron microscopy", "SEM", "TEM", "STEM", "FIB", "EDS", "provenance", "FAIR", "Globus", "NUANCE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "PyWavelets>=1.4",
    "pandas>=2.0",
    "tifffile>=2023.7",
    "imagecodecs>=2023.1",
    "h5py>=3.8",
    "zarr>=3.0",
    "rosettasciio>=0.6",
    "requests>=2.28",
    "cryptography>=42",
    "EMDataBridge>=0.1",   # researcher identity (ORCID, signing keys)
]

[project.optional-dependencies]
globus = ["globus-sdk>=3.46"]
studio = ["fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9", "matplotlib>=3.7", "imageio>=2.30"]
plot = ["matplotlib>=3.7"]
dev = ["pytest", "httpx", "build", "twine", "globus-sdk>=3.46", "matplotlib", "mrcfile", "fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9", "imageio>=2.30"]
all = ["globus-sdk>=3.46", "matplotlib>=3.7", "mrcfile", "fastapi>=0.110", "uvicorn>=0.27", "python-multipart>=0.0.9", "imageio>=2.30"]

[project.urls]
Homepage = "https://github.com/NUANCE-IT/NUScope"
Documentation = "https://nuance-it.github.io/NUScope/"
Changelog = "https://nuance-it.github.io/NUScope/changelog/"
Issues = "https://github.com/NUANCE-IT/NUScope/issues"
Author = "https://github.com/rmsreis"

[project.scripts]
nuscope = "nuscope.cli:main"

# NUANCE-MCP loads NUScope's tools and saves every acquisition as a sealed .h5 (see nuscope.mcp)
[project.entry-points."nuance_mcp.plugins"]
nuscope = "nuscope.mcp:register"

[tool.hatch.build.targets.sdist]
include = ["src/nuscope", "tests", "docs", "examples", "README.md", "LICENSE", "AUTHORS.md", "CITATION.cff",
           "mkdocs.yml", "requirements-docs.txt"]

[tool.hatch.build.targets.wheel]
packages = ["src/nuscope"]
artifacts = ["src/nuscope/studio/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
